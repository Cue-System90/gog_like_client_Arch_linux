[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milkyway"
version = "0.5.1"
description = "Inoffizieller nativer Client für GOG.com auf CachyOS/Arch Linux mit Proton-Auswahl pro Spiel und Steam-kompatiblen Startoptionen"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
vdf = ["vdf"]

[project.scripts]
milkyway = "milkyway.__main__:main"

[tool.setuptools.packages.find]
include = ["milkyway*"]

[tool.setuptools.package-data]
"milkyway" = ["locale/*.po"]
"milkyway.ui" = ["*.css"]
