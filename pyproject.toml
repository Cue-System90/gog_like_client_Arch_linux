[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-cluster"
version = "0.6.0"
description = "Inoffizieller nativer Client für GOG.com auf CachyOS/Arch Linux mit Proton-Auswahl pro Spiel und Steam-kompatiblen Startoptionen"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
vdf = ["vdf"]

[project.scripts]
local-cluster = "local_cluster.__main__:main"

[tool.setuptools.packages.find]
include = ["local_cluster*"]

[tool.setuptools.package-data]
"local_cluster" = ["locale/*.po"]
"local_cluster.ui" = ["*.css"]
